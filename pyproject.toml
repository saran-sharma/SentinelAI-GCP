[project]
name = "sentinelai"
version = "1.0.0"
description = "AI-powered incident triage and noise suppression for Google Cloud"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RET"]
ignore = ["S101", "B008", "RET504"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
